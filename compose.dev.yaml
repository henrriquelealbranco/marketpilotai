name: marketpilot-phase1
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marketpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
      POSTGRES_DB: marketpilot
    ports:
      - '127.0.0.1:5439:5432'
    volumes:
      - marketpilot-phase1-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketpilot -d marketpilot']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
volumes:
  marketpilot-phase1-data:
